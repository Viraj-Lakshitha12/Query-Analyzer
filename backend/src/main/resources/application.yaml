server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: query-analyzer

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/analyzer_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # ── JPA ─────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Jackson ─────────────────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # ── Flyway migrations ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis ───────────────────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

  # ── Async thread pool ───────────────────────────────────────────────────────
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 500

# ── JWT Configuration ──────────────────────────────────────────────────────
queryanalyzer:
  jwt:
    secret: ${JWT_SECRET:QueryAnalyzer2026SecretKeyForJWTSigningMustBeAtLeast256Bits!!}
    expiration-ms: ${QUERYANALYZER_JWT_EXPIRATION_MS:86400000}  # 24 hours
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:mock_key}

# ── Springdoc (Swagger UI) ──────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.queryanalyzer.backend: DEBUG
    org.springframework.web.socket: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true