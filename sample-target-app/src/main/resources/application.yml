server:
  port: 8081

spring:
  application:
    name: sample-target-app
  datasource:
    url: jdbc:postgresql://localhost:5433/analyzer_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

queryanalyzer:
  enabled: true
  sdk-key: "ql_live_ff5e21cb5f954a118313d050"
  server-url: http://localhost:8080
  batch-size: 10
  flush-interval-ms: 500
  queue-capacity: 1000
